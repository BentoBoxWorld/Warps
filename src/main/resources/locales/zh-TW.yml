warp:
  help:
    description: 傳送至玩家的傳送告示牌
    parameters: <玩家名稱>
warps:
  deactivate: <red>舊的傳送告示牌已停用！</red>
  error:
    does-not-exist: <red>哎呀！該傳送點已不存在！</red>
    no-permission: <red>你沒有權限這麼做！</red>
    no-remove: <red>你不能移除該告示牌！</red>
    no-warps-yet: <red>目前沒有任何可用的傳送點。</red>
    not-enough-level: <red>你的島嶼等級不足！</red>
    not-on-island: <red>你必須位於自己的島嶼上才能這麼做！</red>
    not-safe: <red>該傳送點不安全！</red>
    your-level-is: <red>你的島嶼等級只有 [level]，必須高於 [required]。請執行 level 指令。</red>
    not-correct-rank: <red>你的島嶼權限等級不足，無法設置傳送點！</red>
  help:
    description: 開啟傳送點面板
  player-warped: <dark_green>[name] 已傳送到你的 [gamemode] 傳送告示牌！</dark_green>
  sign-removed: <red>傳送告示牌已移除！</red>
  success: <green>成功！</green>
  warpTip: <gold>在告示牌第一行輸入 [text] 即可建立傳送點。</gold>
  warpToPlayersSign: <gold>正在傳送至 [player] 的傳送告示牌。</gold>
  gui:
    titles:
      # The title of warp panel
      warp-title: <black><bold>傳送告示牌</bold></black>
    buttons:
      # Button that is used in multi-page GUIs which allows to return to previous page.
      previous:
        name: <white><bold>上一頁</bold></white>
        description: <gray>切換至第 [number] 頁。</gray>
      # Button that is used in multi-page GUIs which allows to go to next page.
      next:
        name: <white><bold>下一頁</bold></white>
        description: <gray>切換至第 [number] 頁。</gray>
      # Button for a warp
      warp:
        name: <white><bold>[name]</bold></white>
        description: '[sign_text]'
      # Button for a random warp
      random:
        name: <white><bold>隨機傳送</bold></white>
        description: <gray>嗯……會傳送到哪裡呢？</gray>
    tips:
      click-to-previous: <yellow>點擊 </yellow><gray>即可查看上一頁。</gray>
      click-to-next: <yellow>點擊 </yellow><gray>即可查看下一頁。</gray>
      click-to-warp: <yellow>點擊 </yellow><gray>即可傳送。</gray>
  conversations:
    # Prefix for messages that are send from server.
    prefix: '<gold><bold>[BentoBox]: </bold></gold><reset>'
togglewarp:
  help:
    description: 切換傳送告示牌的顯示狀態
  enabled: <green>你的傳送點現在已公開！</green>
  disabled: <red>你的傳送點現在已隱藏！</red>
  error:
    no-permission: <red>你沒有權限這麼做！</red>
    generic: <red>切換傳送點時發生錯誤。</red>
    no-warp: <red>你沒有可切換的傳送點！</red>
protection:
  flags:
    PLACE_WARP:
      name: 放置傳送告示牌
      description: 允許放置傳送告示牌
